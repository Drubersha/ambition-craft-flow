# Self-hosted LeasePlease: app + Supabase stack
# Based on the official supabase/docker reference, trimmed to the services this app uses.

name: leaseplease

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SITE_URL: ${SITE_URL}
      # Transactional email (UniSender Go) + in-app notification webhook
      UNISENDER_GO_API_KEY: ${UNISENDER_GO_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      UNISENDER_GO_API_URL: ${UNISENDER_GO_API_URL}
      NOTIFY_WEBHOOK_SECRET: ${NOTIFY_WEBHOOK_SECRET}
      # AI task recognition (OpenAI-compatible endpoint, e.g. local ollama)
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      kong:
        condition: service_started
      auth:
        condition: service_started
      rest:
        condition: service_started

  db:
    image: supabase/postgres:15.8.1.020
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      # SQL files in this dir run on first init (empty volume only)
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./supabase/volumes/db/init:/docker-entrypoint-initdb.d/init:ro
    ports:
      # Localhost-only: nothing outside this host needs direct Postgres access
      # (scripts use `docker compose exec db`), and a publicly exposed 5432 is a
      # brute-force/leak target. Host-local psql still works via 127.0.0.1:5432.
      - "127.0.0.1:5432:5432"

  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      # Only allow auth redirects back to our own site (exact origin + any path).
      # A "*" wildcard would let a crafted signup/recovery link redirect the user —
      # with their tokens in the URL fragment — to an attacker page. Override via
      # GOTRUE_URI_ALLOW_LIST in .env if extra origins are ever needed.
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-${SITE_URL},${SITE_URL}/*}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}
      # SMTP for registration confirmation + password-reset emails.
      # When these are blank GoTrue can't send mail; keep GOTRUE_MAILER_AUTOCONFIRM=true
      # in that case so signups still work. Set them + AUTOCONFIRM=false to enable emails.
      # NOTE: GOTRUE_SMTP_PORT is parsed as an integer — an empty value makes GoTrue
      # crash-loop on startup, so it MUST always be numeric. Default to 587 when unset.
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-}

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}

  storage:
    image: supabase/storage-api:v1.11.13
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - storage-data:/var/lib/storage

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    # Kong 2.x does NOT interpolate env vars inside the declarative config, so the
    # ${SUPABASE_*} placeholders in kong.yml would be loaded literally (every real
    # API key then gets 401). Substitute ONLY the two known placeholders with sed —
    # never `eval` the whole file (eval would execute any $(...)/backticks that end
    # up in kong.yml as root inside the container). Keys are base64url JWTs, so
    # they contain no sed-special characters (| & \).
    entrypoint: bash -c 'sed -e "s|\$${SUPABASE_ANON_KEY}|$$SUPABASE_ANON_KEY|g" -e "s|\$${SUPABASE_SERVICE_KEY}|$$SUPABASE_SERVICE_KEY|g" /home/kong/temp.yml > /home/kong/kong.yml && exec /docker-entrypoint.sh kong docker-start'
    ports:
      - "8000:8000/tcp"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./supabase/volumes/kong.yml:/home/kong/temp.yml:ro
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started

volumes:
  db-data:
  storage-data:
