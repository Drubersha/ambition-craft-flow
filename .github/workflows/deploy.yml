name: Deploy to server

# Автодеплой на self-hosted сервер при коммите в main.
# Обновляется ТОЛЬКО код приложения (src/public/package.json и т.п.) и пересобирается
# контейнер app. Серверная инфраструктура (Dockerfile, docker-compose, kong, Caddy, .env)
# остаётся локальной на сервере и не перезаписывается.
#
# Требуются секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_HOST  — IP/домен сервера
#   SSH_USER  — пользователь (например root)
#   SSH_KEY   — приватный SSH-ключ для входа на сервер
#   SSH_PORT  — (необязательно) порт SSH, по умолчанию 22

on:
  push:
    branches: [main]
  schedule:
    # Ежедневный деплой в 00:01 по Москве (MSK = UTC+3 → 21:01 UTC).
    # GitHub Actions использует UTC. Поменяй время — пересчитай в UTC.
    - cron: "1 21 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/leaseplease

            echo "== Диск ДО деплоя =="
            df -h /
            docker system df
            du -sh /root/leaseplease-backups 2>/dev/null || true

            echo "== Забираем свежий код =="
            git fetch origin main
            # Сначала обновляем сами скрипты (бэкап/restore), не трогая инфраструктуру.
            # Не глушим ошибку: без свежего backup.sh деплой должен упасть, а не сделать
            # вид, что бэкап выполнен.
            git checkout origin/main -- scripts
            if [ ! -f scripts/backup.sh ]; then
              echo "scripts/backup.sh отсутствует после checkout — прерываю деплой"
              exit 1
            fi

            echo "== Бэкап данных ПЕРЕД изменениями (Postgres + storage) =="
            bash scripts/backup.sh predeploy

            # Обновляем только код приложения; инфраструктурные файлы не трогаем.
            git checkout origin/main -- src public package.json bun.lock components.json tsconfig.json vite.config.ts

            echo "== Освобождаем память на время сборки (останавливаем realtime) =="
            docker compose stop realtime || true

            echo "== Пересобираем приложение =="
            docker compose up -d --build app

            echo "== Возвращаем realtime =="
            docker compose start realtime || true

            echo "== Чистим висячие образы (старые слои app после пересборок) =="
            docker image prune -f

            echo "== Чистим кэш сборки (главный пожиратель диска: ~1 ГБ за пересборку) =="
            # Оставляем 4 ГБ свежего кэша, чтобы ежедневная сборка оставалась быстрой.
            docker builder prune -f --keep-storage 4GB

            echo "== Статус =="
            docker compose ps

            echo "== Диск ПОСЛЕ деплоя =="
            df -h /
            docker system df
